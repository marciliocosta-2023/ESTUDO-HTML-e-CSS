<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Giannis-Zographos-South-American-Football-Club-Palmeiras.32.png" type="image/x-icon">
    <title>Listas</title>
    <style>
        body {
            background-color: blueviolet;
        }
        body h1 {
            background-color: lightgreen;
            color: black;
        }
        ul {
            background-color: black;
            color: wheat;
        }
    </style>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em <span title="Linguagem de marcação de texto">HTML</span>, podemos usar as tags da lista a seguir. Passe o mouse por cima da palavra pra descobrir a tag!</p>
    <ul>
        <li><span title="Usando a tag <p>">Páragrafos</span></li>
        <li><span title="Usando a tag <h1>">Títulos</span></li>
        <li><span title="Usando a tag <img>">Imagens</span></li>
        <li><span title="Usando a tag <abbr>">Abreviações</span></li>
        <li><span title="Usando a tag <code>">Código-fonte</span></li>
        <li><span title="Usando a tag <ol>">Listas numeradas</span></li>
        <li><span title="Usando a tag <ul>">Listas com demarcadores</span></li>
    </ul>

</body>
</html>
