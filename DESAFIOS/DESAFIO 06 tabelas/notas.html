<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            margin: auto;
            width: 70%;
            position: relative;
        }

        caption {
            color: white;
            background-color: black;
            padding: 20px;
            font-weight: bold;
        }

        thead , th#media , td#result {
            background-color: gray;
            color: white;
            font-weight: bold;
        }

        thead > tr > th {
            position: sticky;
            top: -1px;
            background-color: gray;
        }

        td, th {
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }

        td > p {
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }
    </style>
    <title>Tabela de Notas</title>
</head>
<body>
    <table>
        <caption>MÉDIAS DO BIMESTRE</caption>
        <thead>
            <tr>
                <th scope="col">Área</th>
                <th scope="col">Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas
                    <p>NOTA 1 /////////// NOTA 2</p>
                </th>
                <th scope="col">Média</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">EXATAS</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th scope="row" id="media"  colspan="4"><strong>Média de Exatas</strong></td>
                <td id="result">0.0</td>
            </tr>

            <tr>
                <th scope="rowgroup" rowspan="2">HUMANAS</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>

        <tfoot>
            <th scope="row" id="media" colspan="4"><strong>MÉDIA DE HUMANAS</strong></th>
            <td id="result">0.0</td>
        </tfoot>
    </table>
</body>
</html>
