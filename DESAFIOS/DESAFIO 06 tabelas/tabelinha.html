<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAFI</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            height: 500px;
            margin: auto;
        }

        td {
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>DESAFIO</h1>

    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td rowspan="2">C</td>
            <td>D</td>
        </tr>

        <tr>
            <td>E</td>
            <td>F</td>
            <td>H</td>
        </tr>

        <tr>
            <td colspan="3">I</td>
            <td>L</td>
        </tr>

        <tr>
            <td rowspan="2">M</td>
            <td colspan="2">N</td>
            <td>P</td>
        </tr>

        <tr>
            <td>R</td>
            <td>S</td>
            <td>T</td>
        </tr>
    </table>
</body>
</html>
