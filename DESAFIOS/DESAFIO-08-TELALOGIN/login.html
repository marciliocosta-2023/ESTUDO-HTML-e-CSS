<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="estilogeral.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_box" />
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=key"/>

    <title>Tela de Login</title>
</head>
<body>
    <main>
        <div id="login">
            <h2>Login</h2>
            <p class="abaixo">
                Seja bem-vindo(a). Faça login para acessar sua conta e poder fazer configurações no seu ambiente.
            </p>

            <p id="loginp1">
                <label for="ilogin">
                    <span id="icon" class="material-symbols-outlined">account_box</span>
                </label>
                <input class="loginpp" type="email" name="ilogin" id="ilogin">
            </p>

            <p id="loginp2">
                <label for="isenha">
                    <span id="icon" class="material-symbols-outlined">key</span>
                </label>
                <input class="loginpp" type="password" name="isenha" id="isenha">
            </p>

            <p>
                <input  type="submit" value="Entrar"><br>
                <input  type="reset" value="Esqueci a senha">
            </p>
        </div>
    </main>
</body>
</html>
