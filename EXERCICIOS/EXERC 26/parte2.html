<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parte dois</title>
    <style>
        .bloco {
            background-image: url(wallpaper003.jpg);
            background-color: rgb(0, 255, 21);
            height: 200px;
            border: 1px solid black;
            margin: 5px;
            border-radius: 10px;
        }

        div#bloco1 {
            background-position: left top;
        }   

        div#bloco2 {
            background-position: left center;
        }   

        div#bloco3 {
            background-position: right bottom;
        }
    </style>
</head>
<body>
    <div id="bloco1" class="bloco"></div>

    <div id="bloco2" class="bloco"></div>

    <div id="bloco3" class="bloco"></div>
</body>
</html>
