<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafo</title>
</head>
<body>
    <h1>Palmeiras</h1>
    <hr>
    <p1>Voce por escrever um paragrafo de
        qualquer jeito, &lt;so&gt; colocar dentro dos
        parenteses!
    </p1>
    <p2>Se precisar quebrar o texto
        so usar a tag <br> e pronto
    </p2>
    <p3> Simbolos
        &euro;
        &cent;
        &uparrow;
    </p3>
    <p4> EMOJIS <br>
         &#x2705;  &#x2705; &#x2705;  &#x2705; 
    </p4>
</body>
</html>
