<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forularios 2</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p> 
            <label for="nome">Nome: </label> 
            <input type="text" name="nome" id="nome" required minlength="5" maxlength="10" size="100">
        </p>
        <p> 
            <label for="senha">Senha: </label>
            <input type="password" name="senha" id="senha" required minlength="5" maxlength="10" size="1000" placeholder="seu e-mail">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
