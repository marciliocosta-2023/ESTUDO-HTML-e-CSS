<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulario</h1>
        <form action="cadastro.php" method="get">

            <fieldset>

                <legend>
                    SEXO:
                </legend>


                <p>
                    <label for="imasculino">MASCULINO</label>
                    <input type="radio" name="isex" id="imasculino" checked> <br>

                    <label for="ifeminino">FEMININO</label>
                    <input type="radio" name="isex" id="ifeminino">
                </p>
                
            </fieldset>

            <fieldset>

                <legend>
                    <strong>ESPORTES FAVORITOS</strong>
                </legend>

                    <p>
                        <label for="ifutebol">FUTEBOL</label>
                        <input type="checkbox" name="ifutebol" id="ifutebol">
                    </p>

                    <p>
                        <label for="ibasquete">BASQUETE</label>
                        <input type="checkbox" name="ibasquete" id="ibasquete">
                    </p>
                    
                    <p>
                        <label for="ivolei">VOLÊI</label>
                        <input type="checkbox" name="ivolei" id="ivolei">
                    </p>

                    <p>
                        <input type="submit" value="ENVIAR">
                        <input type="reset" value="LIMPAR">
                    </p>


            </fieldset>
    </form>
</body>
</html>
