<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 3</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <fieldseT>
            <legend>DADOS PESSOAIS:</legend>
            <p>
                <label for="nome">NOME:</label>
                <input type="date" name="nome" id="nome" required minlength="5" size="20" placeholder="seu nome">
            </p>
            <p>
                <label for="senha">SENHA:</label>
                <input type="number" name="senha" id="senha" required minlength="5" size="20" placeholder="sua senha" step="0.5">
            </p>
            <p>
                <input type="submit" value="ENIVAR">
                <input type="reset" value="LIMPAR">
            </p>
            <p>
                <label for="data">DATA:</label>
                <input type="email" name="data" id="data">
                <label for="numero">CELULAR:</label>
                <input type="tel" name="numero" id="numero" required pattern="^\(\d{2})\d{4,5}-\d{4}$" placeholder="(xx)-xxxxx-xxxx">
                <label for="teste">teste:</label>
                <input type="week" name="teste" id="teste" maxlength="11">
            </p>
            <p>
                <input type="submit" value="ENVIARRRRRR">
            </p>
        </fieldseT>
    </form>
</body>
</html>
