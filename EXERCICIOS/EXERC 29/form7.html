<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>FORMULARIO</h1>
    <form action="cadastro.php">

        <p>
            <label for="itext">ESCREVA</label>
            <input type="number" name="itext" id="itext" min="1" max="20"
            oninput="isoma.innerHTML = Number(itext.value) * Number(itext2.value)">
        </p>

         <p>
            <label for="itext2">ESCREVA</label>
            <input type="number" name="itext2" id="itext2" min="1" max="20"
            oninput="isoma.innerHTML = Number(itext.value) * Number(itext2.value)">
        </p>

        <p>
            <label for="isoma">SOMA:</label>
            <output id="isoma"></output>
        </p>


        <p>
            <input type="submit" value="ENVIAR">
            <input type="reset" value="LIMPAR">
        </p>

    </form>
</body>
</html>
